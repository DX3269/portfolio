<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101520"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bb9a"/>
      <stop offset="100%" stop-color="#A9FF5B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  <rect width="798" height="448" x="1" y="1" rx="15" fill="none" stroke="#25304a" stroke-width="1.5"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 36)">
    <rect width="260" height="30" rx="15" fill="#172236" stroke="#2a3d5e" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="#A9FF5B" filter="url(#glow)"/>
    <text x="30" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">LOCAL RAG &amp; MISTRAL PIPELINE</text>
  </g>

  <!-- Connecting Lines with arrows -->
  <path d="M 230 225 L 300 225" stroke="#A9FF5B" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="305,225 295,220 295,230" fill="#A9FF5B"/>

  <path d="M 490 225 L 560 225" stroke="#A9FF5B" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="565,225 555,220 555,230" fill="#A9FF5B"/>

  <!-- Step 1: Document Processing -->
  <g transform="translate(50, 130)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="180" height="4" rx="2" fill="#00bb9a"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#142834"/>
      <path d="M 12 8 L 22 8 L 26 12 L 26 28 L 12 28 Z" fill="none" stroke="#00bb9a" stroke-width="2"/>
      <line x1="16" y1="16" x2="22" y2="16" stroke="#00bb9a" stroke-width="1.5"/>
      <line x1="16" y1="20" x2="22" y2="20" stroke="#00bb9a" stroke-width="1.5"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Document Ingestion</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" leading="15">
      <tspan x="20" dy="0">• PDF Parsing</tspan>
      <tspan x="20" dy="16">• Recursive Chunking</tspan>
      <tspan x="20" dy="16">• Token Overlap</tspan>
      <tspan x="20" dy="16">• Text Preprocessing</tspan>
    </text>
  </g>

  <!-- Step 2: Vector Search & Local Mistral (Center) -->
  <g transform="translate(310, 115)">
    <rect width="200" height="220" rx="12" fill="url(#cardGrad)" stroke="#A9FF5B" stroke-width="1.5" opacity="0.95"/>
    <rect width="200" height="4" rx="2" fill="url(#accentGrad)"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1c3024"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="#A9FF5B" stroke-width="2"/>
      <circle cx="18" cy="18" r="3" fill="#A9FF5B"/>
    </g>
    <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Mistral AI + Ollama</text>
    <text x="20" y="104" fill="#A9FF5B" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">LOCAL INFERENCE ENGINE</text>
    
    <g transform="translate(20, 120)">
      <rect width="160" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">Vector Similarity Search</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="160" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">Ollama Mistral-7B</text>
    </g>
    <text x="20" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">100% On-Premises &amp; Private</text>
  </g>

  <!-- Step 3: FastAPI & React Chat -->
  <g transform="translate(570, 130)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="180" height="4" rx="2" fill="#00bb9a"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#142834"/>
      <path d="M 10 12 L 26 12 L 26 22 L 18 22 L 12 26 L 12 22 L 10 22 Z" fill="none" stroke="#00bb9a" stroke-width="2"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">React + FastAPI</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="20" dy="0">• Streaming Chat API</tspan>
      <tspan x="20" dy="16">• Document Grounding</tspan>
      <tspan x="20" dy="16">• Cited Page References</tspan>
      <tspan x="20" dy="16">• Interactive UI Controls</tspan>
    </text>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(50, 385)">
    <rect width="700" height="36" rx="8" fill="#0d131f" stroke="#1f293d" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TECH STACK:</text>
    
    <g transform="translate(100, 7)">
      <rect width="60" height="22" rx="4" fill="#172233"/>
      <text x="30" y="15" fill="#A9FF5B" font-family="monospace" font-size="10" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(170, 7)">
      <rect width="65" height="22" rx="4" fill="#172233"/>
      <text x="32" y="15" fill="#A9FF5B" font-family="monospace" font-size="10" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(245, 7)">
      <rect width="80" height="22" rx="4" fill="#172233"/>
      <text x="40" y="15" fill="#A9FF5B" font-family="monospace" font-size="10" text-anchor="middle">Mistral AI</text>
    </g>
    <g transform="translate(335, 7)">
      <rect width="65" height="22" rx="4" fill="#172233"/>
      <text x="32" y="15" fill="#A9FF5B" font-family="monospace" font-size="10" text-anchor="middle">Ollama</text>
    </g>
    <g transform="translate(410, 7)">
      <rect width="55" height="22" rx="4" fill="#172233"/>
      <text x="27" y="15" fill="#A9FF5B" font-family="monospace" font-size="10" text-anchor="middle">React</text>
    </g>
  </g>
</svg>
