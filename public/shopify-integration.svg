<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101520"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#95bf47"/>
      <stop offset="100%" stop-color="#5e8e3e"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad3)"/>
  <rect width="798" height="448" x="1" y="1" rx="15" fill="none" stroke="#25304a" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 36)">
    <rect width="310" height="30" rx="15" fill="#172236" stroke="#2a3d5e" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="#95bf47" filter="url(#glow3)"/>
    <text x="30" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SHOPIFY CUSTOM APP &amp; OMS INTEGRATION</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 230 225 L 300 225" stroke="#95bf47" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="305,225 295,220 295,230" fill="#95bf47"/>

  <path d="M 500 225 L 560 225" stroke="#95bf47" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="565,225 555,220 555,230" fill="#95bf47"/>

  <!-- Step 1: Shopify Storefront & Liquid -->
  <g transform="translate(50, 130)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad3)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="180" height="4" rx="2" fill="#95bf47"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1c2d1b"/>
      <path d="M 12 10 L 24 10 L 26 26 L 10 26 Z" fill="none" stroke="#95bf47" stroke-width="2"/>
      <path d="M 15 10 C 15 7 21 7 21 10" fill="none" stroke="#95bf47" stroke-width="1.8"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Shopify Storefront</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="20" dy="0">• Liquid Theme Dev</tspan>
      <tspan x="20" dy="16">• Product Placement</tspan>
      <tspan x="20" dy="16">• Order Webhooks</tspan>
      <tspan x="20" dy="16">• Cart &amp; Checkout Flow</tspan>
    </text>
  </g>

  <!-- Step 2: Custom App Middleware (Center) -->
  <g transform="translate(310, 115)">
    <rect width="190" height="220" rx="12" fill="url(#cardGrad3)" stroke="#95bf47" stroke-width="1.5" opacity="0.95"/>
    <rect width="190" height="4" rx="2" fill="url(#accentGrad3)"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1c2d1b"/>
      <rect x="8" y="12" width="20" height="14" rx="2" fill="none" stroke="#95bf47" stroke-width="2"/>
      <circle cx="14" cy="19" r="2" fill="#95bf47"/>
      <circle cx="22" cy="19" r="2" fill="#95bf47"/>
    </g>
    <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Custom App Gateway</text>
    <text x="20" y="104" fill="#95bf47" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">SHOPIFY CLI &amp; REST APIS</text>
    
    <g transform="translate(20, 120)">
      <rect width="150" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">Order Sync Automation</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="150" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">Postman API QA</text>
    </g>
    <text x="20" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Real-time bi-directional sync</text>
  </g>

  <!-- Step 3: Order Management Systems -->
  <g transform="translate(560, 130)">
    <rect width="190" height="190" rx="12" fill="url(#cardGrad3)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="190" height="4" rx="2" fill="#95bf47"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1c2d1b"/>
      <path d="M 8 14 L 18 8 L 28 14 L 18 20 Z" fill="none" stroke="#95bf47" stroke-width="1.8"/>
      <path d="M 8 14 L 8 22 L 18 28 L 28 22 L 28 14" fill="none" stroke="#95bf47" stroke-width="1.8"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">OMS / Fulfillment</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="20" dy="0">• Inventory Reservation</tspan>
      <tspan x="20" dy="16">• Status Webhooks</tspan>
      <tspan x="20" dy="16">• Multi-location Dispatch</tspan>
      <tspan x="20" dy="16">• Tracking Propagation</tspan>
    </text>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(50, 385)">
    <rect width="700" height="36" rx="8" fill="#0d131f" stroke="#1f293d" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TECH STACK:</text>
    
    <g transform="translate(100, 7)">
      <rect width="80" height="22" rx="4" fill="#172233"/>
      <text x="40" y="15" fill="#95bf47" font-family="monospace" font-size="10" text-anchor="middle">Shopify CLI</text>
    </g>
    <g transform="translate(190, 7)">
      <rect width="60" height="22" rx="4" fill="#172233"/>
      <text x="30" y="15" fill="#95bf47" font-family="monospace" font-size="10" text-anchor="middle">Liquid</text>
    </g>
    <g transform="translate(260, 7)">
      <rect width="70" height="22" rx="4" fill="#172233"/>
      <text x="35" y="15" fill="#95bf47" font-family="monospace" font-size="10" text-anchor="middle">REST APIs</text>
    </g>
    <g transform="translate(340, 7)">
      <rect width="65" height="22" rx="4" fill="#172233"/>
      <text x="32" y="15" fill="#95bf47" font-family="monospace" font-size="10" text-anchor="middle">Postman</text>
    </g>
    <g transform="translate(415, 7)">
      <rect width="60" height="22" rx="4" fill="#172233"/>
      <text x="30" y="15" fill="#95bf47" font-family="monospace" font-size="10" text-anchor="middle">Python</text>
    </g>
  </g>
</svg>
