<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101520"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad2)"/>
  <rect width="798" height="448" x="1" y="1" rx="15" fill="none" stroke="#25304a" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 36)">
    <rect width="280" height="30" rx="15" fill="#172236" stroke="#2a3d5e" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="#38bdf8" filter="url(#glow2)"/>
    <text x="30" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MARKETPLACE ETL AUTOMATION</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 230 225 L 300 225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="305,225 295,220 295,230" fill="#38bdf8"/>

  <path d="M 500 225 L 560 225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <polygon points="565,225 555,220 555,230" fill="#38bdf8"/>

  <!-- Step 1: Raw Catalog Extraction -->
  <g transform="translate(50, 130)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad2)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="180" height="4" rx="2" fill="#0284c7"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#13263b"/>
      <ellipse cx="18" cy="12" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M 8 12 L 8 22 C 8 25 28 25 28 22 L 28 12" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Catalog Data Extraction</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="20" dy="0">• MySQL Product DB</tspan>
      <tspan x="20" dy="16">• Multi-variant SKUs</tspan>
      <tspan x="20" dy="16">• Inventory &amp; Pricing</tspan>
      <tspan x="20" dy="16">• Attribute Normalization</tspan>
    </text>
  </g>

  <!-- Step 2: YAML Rules & Pandas (Center) -->
  <g transform="translate(310, 115)">
    <rect width="190" height="220" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <rect width="190" height="4" rx="2" fill="url(#accentGrad2)"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#13263b"/>
      <rect x="10" y="10" width="16" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <line x1="14" y1="18" x2="22" y2="18" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <text x="20" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Rules &amp; Validation Engine</text>
    <text x="20" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">PANDAS + YAML LOGIC</text>
    
    <g transform="translate(20, 120)">
      <rect width="150" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">YAML Taxonomy Rules</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="150" height="30" rx="6" fill="#111827" stroke="#2e3d55" stroke-width="1"/>
      <text x="10" y="19" fill="#cbd5e1" font-family="monospace" font-size="10">Automated Data QA</text>
    </g>
    <text x="20" y="212" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Zero Data Discrepancies</text>
  </g>

  <!-- Step 3: Multi-channel Export -->
  <g transform="translate(560, 130)">
    <rect width="190" height="190" rx="12" fill="url(#cardGrad2)" stroke="#2b3752" stroke-width="1.5"/>
    <rect width="190" height="4" rx="2" fill="#0284c7"/>
    <!-- Icon -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#13263b"/>
      <rect x="8" y="8" width="20" height="20" rx="2" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <line x1="8" y1="14" x2="28" y2="14" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="16" y1="8" x2="16" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <text x="20" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Marketplace Formats</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="20" dy="0">• Debenhams UK (XLSX)</tspan>
      <tspan x="20" dy="16">• Allegro PL Templates</tspan>
      <tspan x="20" dy="16">• OpenPyXL Custom Styling</tspan>
      <tspan x="20" dy="16">• Instant Review-Ready</tspan>
    </text>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(50, 385)">
    <rect width="700" height="36" rx="8" fill="#0d131f" stroke="#1f293d" stroke-width="1"/>
    <text x="20" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TECH STACK:</text>
    
    <g transform="translate(100, 7)">
      <rect width="60" height="22" rx="4" fill="#172233"/>
      <text x="30" y="15" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(170, 7)">
      <rect width="60" height="22" rx="4" fill="#172233"/>
      <text x="30" y="15" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">MySQL</text>
    </g>
    <g transform="translate(240, 7)">
      <rect width="65" height="22" rx="4" fill="#172233"/>
      <text x="32" y="15" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">pandas</text>
    </g>
    <g transform="translate(315, 7)">
      <rect width="75" height="22" rx="4" fill="#172233"/>
      <text x="37" y="15" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">openpyxl</text>
    </g>
    <g transform="translate(400, 7)">
      <rect width="55" height="22" rx="4" fill="#172233"/>
      <text x="27" y="15" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">YAML</text>
    </g>
  </g>
</svg>
